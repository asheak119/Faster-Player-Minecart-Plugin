name: FastMinecarts
version: '1.0'
main: com.example.fastminecarts.FastMinecartsPlugin
api-version: '1.21'
description: Allows minecarts to travel faster when ridden by a player, and multiplies horse speed.
commands:
  fastminecarts:
    description: Modify the max speed of ridden minecarts.
    usage: /fastminecarts <speed>
    permission: fastminecarts.admin
    aliases: [fmc]
  fasthorses:
    description: Modify the speed multiplier of horses.
    usage: /fasthorses <multiplier>
    permission: fasthorses.admin
    aliases: [fh]
permissions:
  fastminecarts.admin:
    description: Allows you to change the fastminecarts max speed.
    default: op
  fasthorses.admin:
    description: Allows you to change the fasthorses multiplier.
    default: op
